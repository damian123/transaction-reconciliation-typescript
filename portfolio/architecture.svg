<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102942"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#73e0c1"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 48px; font-weight: 700; fill: #f7fbff; }
      .subtitle { font-family: Arial, sans-serif; font-size: 23px; font-weight: 400; fill: #afc5d8; }
      .label { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #f7fbff; }
      .small { font-family: Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #b8ccdc; }
      .chip { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0d2731; }
      .box { fill: #122f49; stroke: #2d5672; stroke-width: 2; }
      .accent { fill: #113e42; stroke: #54c7a7; stroke-width: 2; }
      .warn { fill: #44301f; stroke: #f0b35b; stroke-width: 2; }
      .line { fill: none; stroke: #73e0c1; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="155" fill="#1e5b68" opacity="0.2"/>
  <circle cx="80" cy="760" r="210" fill="#183d66" opacity="0.32"/>

  <text x="72" y="92" class="title">Transaction Reconciliation</text>
  <text x="72" y="132" class="subtitle">Synthetic digital-asset operations · TypeScript · fixed-scale arithmetic</text>

  <g filter="url(#shadow)">
    <rect x="62" y="206" width="178" height="138" rx="18" class="box"/>
    <text x="151" y="247" text-anchor="middle" class="label">Source records</text>
    <text x="151" y="279" text-anchor="middle" class="small">exchange · custody</text>
    <text x="151" y="303" text-anchor="middle" class="small">internal ledger</text>
    <text x="151" y="327" text-anchor="middle" class="small">raw values preserved</text>

    <rect x="286" y="206" width="178" height="138" rx="18" class="accent"/>
    <text x="375" y="247" text-anchor="middle" class="label">Import + normalize</text>
    <text x="375" y="279" text-anchor="middle" class="small">idempotent source key</text>
    <text x="375" y="303" text-anchor="middle" class="small">versioned transform</text>
    <text x="375" y="327" text-anchor="middle" class="small">bigint quantities</text>

    <rect x="510" y="206" width="206" height="138" rx="18" class="box"/>
    <text x="613" y="243" text-anchor="middle" class="label">Ordered rules</text>
    <text x="613" y="272" text-anchor="middle" class="small">exact identifier</text>
    <text x="613" y="296" text-anchor="middle" class="small">explicit one-to-many</text>
    <text x="613" y="320" text-anchor="middle" class="small">composite · tolerance</text>

    <rect x="762" y="206" width="178" height="138" rx="18" class="accent"/>
    <text x="851" y="247" text-anchor="middle" class="label">Explainable case</text>
    <text x="851" y="279" text-anchor="middle" class="small">rule + version</text>
    <text x="851" y="303" text-anchor="middle" class="small">candidate evidence</text>
    <text x="851" y="327" text-anchor="middle" class="small">confidence category</text>

    <rect x="986" y="206" width="154" height="138" rx="18" class="warn"/>
    <text x="1063" y="247" text-anchor="middle" class="label">Exceptions</text>
    <text x="1063" y="279" text-anchor="middle" class="small">invalid</text>
    <text x="1063" y="303" text-anchor="middle" class="small">duplicate</text>
    <text x="1063" y="327" text-anchor="middle" class="small">key conflict</text>
  </g>

  <path d="M240 275 H276" class="line"/>
  <path d="M464 275 H500" class="line"/>
  <path d="M716 275 H752" class="line"/>
  <path d="M940 275 H976" class="line"/>

  <g filter="url(#shadow)">
    <rect x="245" y="445" width="250" height="128" rx="18" class="warn"/>
    <text x="370" y="487" text-anchor="middle" class="label">Human review</text>
    <text x="370" y="518" text-anchor="middle" class="small">retain ambiguous candidates</text>
    <text x="370" y="543" text-anchor="middle" class="small">actor · reason · evidence</text>

    <rect x="525" y="445" width="250" height="128" rx="18" class="box"/>
    <text x="650" y="487" text-anchor="middle" class="label">Late reversal</text>
    <text x="650" y="518" text-anchor="middle" class="small">reopen accepted history</text>
    <text x="650" y="543" text-anchor="middle" class="small">never delete prior decisions</text>

    <rect x="805" y="445" width="270" height="128" rx="18" class="accent"/>
    <text x="940" y="487" text-anchor="middle" class="label">Controls + dashboard</text>
    <text x="940" y="518" text-anchor="middle" class="small">population + quantity/fee totals</text>
    <text x="940" y="543" text-anchor="middle" class="small">every record accounted for</text>
  </g>

  <path d="M851 344 V395 H370 V435" class="line"/>
  <path d="M851 344 V395 H650 V435" class="line"/>
  <path d="M851 344 V395 H940 V435" class="line"/>

  <g>
    <rect x="72" y="674" width="190" height="44" rx="22" fill="#73e0c1"/>
    <text x="167" y="702" text-anchor="middle" class="chip">14 acceptance tests</text>
    <rect x="279" y="674" width="210" height="44" rx="22" fill="#73e0c1"/>
    <text x="384" y="702" text-anchor="middle" class="chip">ambiguity retained</text>
    <rect x="506" y="674" width="212" height="44" rx="22" fill="#73e0c1"/>
    <text x="612" y="702" text-anchor="middle" class="chip">audited overrides</text>
    <rect x="735" y="674" width="226" height="44" rx="22" fill="#73e0c1"/>
    <text x="848" y="702" text-anchor="middle" class="chip">late reversal recovery</text>
  </g>
  <text x="72" y="764" class="small">Synthetic demonstration · No client, exchange, wallet, account, or production data</text>
</svg>
