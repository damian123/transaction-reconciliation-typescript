name: Verify evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Confirm evidence manifest
        run: |
          ./scripts/build-evidence-manifest.sh
          git diff --exit-code -- MANIFEST.sha256
